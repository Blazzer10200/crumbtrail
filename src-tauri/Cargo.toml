[package]
name = "sweep"
version = "0.3.0"
description = "Sweep — scan-first Windows storage cleaner"
authors = ["Blazzer"]
edition = "2021"

[lib]
name = "sweep_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
jwalk = "0.8"
chrono = "0.4"
winreg = "0.55"

[dev-dependencies]
tempfile = "3"
filetime = "0.2"

[dependencies.windows]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
  "Win32_UI_Shell",
]
